name: Import source and build Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import.yml'
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import source
        run: |
          python - <<'IMPORT'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('AetherVM-source.zip') as z:
              for member in z.infolist():
                  relative=Path(member.filename).relative_to('aethervm')
                  if not relative.parts or member.is_dir():
                      continue
                  if '..' in relative.parts:
                      raise ValueError('Unsafe archive path')
                  relative.parent.mkdir(parents=True, exist_ok=True)
                  relative.write_bytes(z.read(member))
          IMPORT
          chmod +x mobile/android/gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A backend mobile deploy qa tests .github .gitignore README.md DEPLOYMENT.md VALIDATION.md render.yaml
          git diff --cached --quiet || git commit -m "AetherVM 0.4.1: clean home, startup animation, profile photo and computer recovery"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: mobile
      - run: cp .env.example .env
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - name: Install browser QA
        run: |
          npm install --prefix /tmp/aethervm-ui-checks playwright@1.61.1
          /tmp/aethervm-ui-checks/node_modules/.bin/playwright install --with-deps chromium
      - name: Check UI flows
        env:
          PLAYWRIGHT_MODULE: /tmp/aethervm-ui-checks/node_modules/playwright/index.mjs
        run: |
          node qa/build-preview.cjs
          node qa/check-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AetherVM-UI-checks
          path: qa/*.png
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check backend
        run: |
          pip install -r backend/requirements.txt pytest httpx
          python -m pytest -q tests
      - name: Compare original character geometry
        run: |
          git clone https://github.com/iduu/grokbot-animation.git /tmp/grokbot-animation
          git -C /tmp/grokbot-animation checkout 6c27d9640c37e02e1eab0c4f7d98fa01196c66b8
          GROKBOT_SOURCE=/tmp/grokbot-animation/component npm --prefix mobile run compare:character
      - run: chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: AetherVM-preview-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
