name: Import source and build Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import.yml'
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import source
        run: |
          python - <<'IMPORT'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('AetherVM-source.zip') as z:
              for member in z.infolist():
                  relative=Path(member.filename).relative_to('aethervm')
                  if not relative.parts or member.is_dir():
                      continue
                  if '..' in relative.parts:
                      raise ValueError('Unsafe archive path')
                  relative.parent.mkdir(parents=True, exist_ok=True)
                  relative.write_bytes(z.read(member))
          IMPORT
          chmod +x mobile/android/gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend mobile .gitignore README.md DEPLOYMENT.md VALIDATION.md render.yaml
          git commit -m "Import AetherVM Android app and backend"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: mobile
      - run: cp .env.example .env
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: AetherVM-preview-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
