name: Import source and build Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import.yml'
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified source
        run: |
          python - <<'IMPORT'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('AetherVM-source.zip') as z:
              for member in z.infolist():
                  relative=Path(member.filename).relative_to('aethervm')
                  if not relative.parts or member.is_dir(): continue
                  if '..' in relative.parts or relative.is_absolute(): raise ValueError('Unsafe archive path')
                  if relative.parts[0]=='.github': continue
                  relative.parent.mkdir(parents=True,exist_ok=True)
                  relative.write_bytes(z.read(member))
          Path('mobile/components/AgentFace.tsx').unlink(missing_ok=True)
          IMPORT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: python -m pytest tests -q
      - name: Publish verified source
        run: |
          chmod +x mobile/android/gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A backend mobile tests deploy qa .gitignore README.md DEPLOYMENT.md VALIDATION.md render.yaml
          git diff --cached --quiet || git commit -m "Ship original morph characters, Home and onboarding, isolated agent computers"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: npm ci
        working-directory: mobile
      - run: cp .env.example .env
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: AetherVM-preview-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
