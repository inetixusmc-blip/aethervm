services:
  api:
    build: ../../backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: /etc/aethervm/backend.env
    environment:
      DEV_AUTH: "false"
      DB_PATH: /data/aethervm.sqlite3
      PORT: "8000"
    volumes:
      - aether-data:/data
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  aether-data:
